<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/general.css" />
    <link rel="stylesheet" href="css/index.css" />
    <title>Sign up Form | larakielcode</title>
  </head>

  <body>
    <!-- Start building the forms -->
    <div class="wrapper">
      <div class="left-container">
        <div class="title-logo-bg">
          <img src="images/odin-lined-logo.png" alt="" />
          <span class="logo-title">ODIN PROJECT</span>
        </div>
        <div class="img-source">
          <p>
            Photo by
            <a href="https://unsplash.com/@pics_by_harry">Harrison Steen</a> on
            <a href="https://unsplash.com">Unsplash</a>
          </p>
        </div>
      </div>
      <div class="right-container">
        <div class="right-container-header">
          <h1>Sign up information</h1>
          <p>
            This is not a real online service! You know you need something like
            this in your life to help you realize your deepest dreams.
            <br />Sign up <em>now</em> to get started.
          </p>
          <p>You <em>know</em> you want to.</p>
        </div>
        <div class="form-controls">
          <p>Let's do this!</p>
          <form action="#" method="post">
            <div class="first">
              <label for="firstname">FIRST NAME</label>
              <input type="text" name="firstname" id="firstname" />
            </div>
            <div class="last">
              <label for="lastname">LAST NAME</label>
              <input type="text" name="lastname" id="lastname" />
            </div>
            <div class="email">
              <label for="email">EMAIL</label>
              <input type="email" name="email" id="email" />
            </div>
            <div class="phone">
              <label for="phone_number">PHONE NUMBER</label>
              <input type="tel" name="phone_number" id="phone_number" />
            </div>
            <div class="passwd">
              <label for="passwd">PASSWORD</label>
              <input type="password" name="passwd" id="passwd" />
            </div>
            <div class="passtwo">
              <label for="passwd_two">CONFIRM PASSWORD</label>
              <input type="password" name="passwd_two" id="passwd_two" />
            </div>
          </form>
        </div>
        <div class="bottom">
          <p>
            <button type="submit">Create Account</button>
          </p>
          <p>Already have an account? <a href="#">Log in</a></p>
        </div>
      </div>
    </div>
  </body>
</html>
