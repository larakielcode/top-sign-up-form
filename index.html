<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/index.css">
    <title>Sign up Form | larakielcode</title>
</head>

<body>

    <!-- Start building the forms -->
    <div class="wrapper">
        <div class="left-container">
            <div class="title-logo-bg">
                <img src="images/odin-lined-logo.png" alt="">
                <span class="logo-title">ODIN PROJECT</span>
            </div>
        </div>
        <div class="right-container">
            <div>
                <h1>Sign up information</h1>
                <p>This is not a real online service! You know you need something like this in your lief to help you
                    realize your deepest dreams. <br>Sign up <em>now</em> to get started.</p>
                <p>You <em>know</em> you want to.</p>
            </div>
            <div>
                <form action="#" method="post">
                    <p>Let's do this!</p>
                    <div class="form-controls">
                        <label for="firstname">FIRST NAME</label>
                        <input type="text" name="firstname" id="firstname">
                        <label for="lastname">LAST NAME</label>
                        <input type="text" name="lastname" id="lastname">
                    </div>
                    <div class="form-controls">
                        <label for="email">EMAIL</label>
                        <input type="email" name="email" id="email">
                        <label for="phone_number">PHONE NUMBER</label>
                        <input type="tel" name="phone_number" id="phone_number">
                    </div>
                    <div class="form-controls">
                        <label for="passwd">PASSWORD</label>
                        <input type="password" name="passwd" id="passwd">
                        <label for="passwd_two">CONFIRM PASSWORD</label>
                        <input type="password" name="passwd_two" id="passwd_two">
                    </div>
                </form>
            </div>
            <div>
                footer
            </div>
        </div>
    </div>

</body>

</html>
